<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBD · Batería de estudio · Temas 1 a 9</title>
<style>
:root{
  --navy:#002E4C; --navy2:#0b4a75; --blue:#1f6fb2; --ink:#1d2733; --muted:#5d6b7a; --line:#dfe5ec;
  --bg:#f4f6f9; --card:#ffffff; --ok:#1e8a4c; --okbg:#e7f6ee; --ko:#c0392b; --kobg:#fdecea; --warn:#b26b00; --warnbg:#fff4e0;
  --chip:#eaf1f8; --code:#f3f5f8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:30px;background:#fff;border-radius:6px;padding:4px 8px}
.htitle{font-weight:700;font-size:17px;line-height:1.2}
.htitle small{display:block;font-weight:400;opacity:.8;font-size:13px}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#cfe0ef;font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:#fff;color:var(--navy);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:26px;color:var(--navy);margin:4px 0 6px}
h2{font-size:20px;color:var(--navy);margin:0 0 10px}
h3{font-size:17px;color:var(--navy);margin:16px 0 8px}
p.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(0,46,76,.08);transform:translateY(-1px)}
.tile b{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}
.tile span{color:var(--muted);font-size:14px}
.big{font-size:30px;font-weight:700;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--navy2)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sec:hover{background:var(--chip)}
.btn.ghost{background:transparent;color:var(--blue);padding:6px 8px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{display:inline-block;background:var(--chip);color:var(--navy);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.tag.lvl{background:#f1ecfb;color:#5b3a99}
.qtext{font-size:17px;font-weight:600;margin:6px 0 12px}
pre.code{background:var(--code);border:1px solid #d7dde5;border-radius:8px;padding:12px 14px;overflow:auto;font-family:Consolas,"Courier New",monospace;font-size:14px;line-height:1.45;margin:8px 0 12px;white-space:pre}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--blue)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--navy);background:#eef4fa}
.opt.sel .l{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.ko .l{background:var(--ko);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid #bfe6cf}
.fb.ko{background:var(--kobg);border:1px solid #f3c6c0}
.fb .ref{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.progress{height:8px;background:#e3e9f0;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--blue)}
.score{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
.score div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px}
.score b{display:block;font-size:24px;color:var(--navy)}
.navq{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.navq button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;cursor:pointer}
.navq button.ans{background:var(--chip);border-color:#b9cfe4}
.navq button.cur{outline:2px solid var(--navy)}
.navq button.ok{background:var(--okbg);border-color:var(--ok)}
.navq button.ko{background:var(--kobg);border-color:var(--ko)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.item summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
.item summary::-webkit-details-marker{display:none}
.item summary .arrow{flex:none;transition:.2s;color:var(--blue)}
.item[open] summary .arrow{transform:rotate(90deg)}
.sub{margin:8px 0 0 0;padding-left:18px}
.sub li{margin:3px 0}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:15px;resize:vertical}
.sol{background:#f7fafc;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin-top:12px}
.sol ul{margin:6px 0;padding-left:20px}
.crit{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.crit td,.crit th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.crit th{background:var(--navy);color:#fff;font-weight:600}
.crit td.n{width:80px;text-align:center}
.crit input{transform:scale(1.2)}
.diagram{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;margin:10px 0}
.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
table.data{border-collapse:collapse;margin:8px 0 12px;font-size:14px;background:#fff}
table.data th,table.data td{border:1px solid #cdd6e0;padding:5px 9px}
table.data th{background:var(--chip);color:var(--navy)}
.reltab li{margin:3px 0;font-family:Consolas,"Courier New",monospace;font-size:14px}
.reltab u{text-decoration-thickness:2px}
.note{background:var(--warnbg);border:1px solid #f1d7a6;border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.copy{float:right;font-size:13px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:640px){nav{margin-left:0;width:100%}nav button{padding:6px 9px;font-size:14px}.qtext{font-size:16px}h1{font-size:22px}}
@media print{header,nav,.btn{display:none}}
</style>
</head>

<script>
const DATA = {"test": [{"tema": 1, "ref": "Tema 1, apdo. 5.3 (Conceptos)", "q": "En una tabla de clientes, cada cliente concreto (cada fila de la tabla) es un:", "ok": "Registro", "mal": ["Campo", "Entidad", "Atributo derivado"], "exp": "El registro es cada fila de la tabla; el campo es cada columna, que identifica un tipo de dato distinto.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 6.4 (Modelo multidimensional)", "q": "¿Qué modelo de base de datos distribuye los datos en matrices de varias dimensiones formando cubos (por ejemplo, ventas por producto, región y tiempo)?", "ok": "Modelo multidimensional", "mal": ["Modelo deductivo", "Modelo objeto-relacional", "Modelo en red"], "exp": "El modelo multidimensional organiza los datos en cubos; un dato puede tener varios valores según el eje que se recorra.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 2.1 (Tipos de ficheros según su organización)", "q": "¿En qué tipo de fichero los datos se organizan con tamaños fijos definidos previamente, de forma que se accede directamente a ellos aunque a veces se desperdicia espacio?", "ok": "Fichero de acceso directo", "mal": ["Fichero secuencial", "Fichero indexado", "Fichero plano o de texto"], "exp": "En los ficheros de acceso directo se fija un tamaño previo para los datos; permite acceso directo, pero puede desperdiciarse espacio en disco.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 8.2 (Bases de datos distribuidas)", "q": "¿Cuál es el modo de construcción de bases de datos distribuidas más usado?", "ok": "Híbrido", "mal": ["Réplica", "Particionado", "Centralizado"], "exp": "El modo híbrido, mezcla de réplica y particionado, es el más usado.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 2.2 (Tipos de ficheros según su contenido)", "q": "Los datos que contienen típicamente las bases de datos se almacenan en ficheros:", "ok": "Binarios, que deben ser procesados por una aplicación concreta según su extensión", "mal": ["De texto, porque así cualquier persona puede leerlos sin software", "Web, con extensiones como html o php", "De configuración, con extensiones como ini o conf"], "exp": "Las bases de datos se basan en ficheros binarios, codificados en binario, que deben procesarse con una aplicación concreta.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 6.3 (Modelo objeto-relacional)", "q": "El modelo objeto-relacional:", "ok": "Incorpora a las bases de datos relacionales ciertas capacidades de las orientadas a objetos, reduciendo costes", "mal": ["Sustituye por completo las tablas por objetos y métodos", "Organiza los datos en cubos de varias dimensiones", "Obtiene nuevos datos a partir de reglas e inferencias"], "exp": "Es un modelo híbrido: añade a las relacionales capacidades de la orientación a objetos (tipos definidos por el usuario, etc.).", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 7.2 (Modelo en red)", "q": "¿Qué modelo se considera una evolución del jerárquico, más flexible porque no tiene por qué seguir una estructura de árbol (por ejemplo, CODASYL)?", "ok": "Modelo en red", "mal": ["Modelo relacional", "Modelo deductivo", "Modelo multidimensional"], "exp": "El modelo en red evoluciona el jerárquico, es más flexible y su ejemplo es CODASYL.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 6.5 (Modelo de bases de datos deductivas)", "q": "¿Qué modelo permite obtener nuevos datos a partir de los existentes mediante procedimientos llamados inferencias?", "ok": "Modelo de bases de datos deductivas", "mal": ["Modelo multidimensional", "Modelo en red", "Modelo jerárquico"], "exp": "Las bases de datos deductivas generan conclusiones (deducen datos) a partir de premisas mediante inferencias.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 7.1 (Modelo jerárquico)", "q": "¿Qué modelo de base de datos organiza los datos en forma de árbol, donde cada nodo hijo solo tiene un padre (por ejemplo, el sistema IMS de IBM)?", "ok": "Modelo jerárquico", "mal": ["Modelo en red", "Modelo relacional", "Modelo multidimensional"], "exp": "El modelo jerárquico crea una jerarquía en árbol: cada nodo puede tener varios hijos, pero cada hijo tiene un único padre. IMS de IBM es su ejemplo más extendido.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 2.1 (Tipos de ficheros según su organización)", "q": "¿En qué tipo de fichero, para acceder a un dato, es necesario pasar antes por todos los datos anteriores?", "ok": "Fichero secuencial", "mal": ["Fichero indexado", "Fichero de acceso directo", "Fichero binario"], "exp": "En los ficheros secuenciales los datos están ordenados de forma consecutiva y hay que recorrer los anteriores para llegar al deseado.", "code": null}, {"tema": 1, "ref": "Tema 1, apdo. 2.1 (Tipos de ficheros según su organización)", "q": "¿Qué tipo de fichero organiza los datos en base a un índice, de forma que el acceso es más rápido pero más complejo de implementar?", "ok": "Fichero indexado", "mal": ["Fichero secuencial", "Fichero de acceso directo", "Fichero plano"], "exp": "En los ficheros indexados los datos se organizan mediante un índice que facilita el acceso; es más rápido, pero más complejo de implementar.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 3.1 (Niveles de la arquitectura)", "q": "En la arquitectura ANSI/X3/SPARC, ¿qué nivel describe las entidades, los atributos, las relaciones entre ellos y las normas que deben cumplir los datos?", "ok": "Nivel conceptual o lógico", "mal": ["Nivel interno o físico", "Nivel externo o de usuario", "Nivel de aplicación"], "exp": "El nivel conceptual (lógico) describe la estructura de los datos, sus relaciones y las normas que deben cumplir; el interno trata del almacenamiento y el externo de la visión del usuario.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 3.1 (Niveles de la arquitectura)", "q": "En la arquitectura ANSI/X3/SPARC, ¿qué nivel representa cómo percibe el usuario la base de datos, siendo habitual que existan varios esquemas de este tipo?", "ok": "Nivel externo o de usuario", "mal": ["Nivel conceptual o lógico", "Nivel interno o físico", "Nivel de almacenamiento"], "exp": "Suele haber un único esquema físico y un único esquema lógico, pero varios esquemas externos, porque a cada usuario se le muestran unos datos y se le ocultan otros.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 2 (Concepto de SGBD)", "q": "Un sistema gestor de bases de datos (SGBD) se define como:", "ok": "La capa de software que utiliza el usuario para gestionar y manipular los datos, garantizando su disponibilidad y la seguridad del sistema", "mal": ["El conjunto de ficheros binarios donde se guardan físicamente los datos", "El lenguaje de consulta estándar declarado por ANSI e ISO", "El dispositivo físico de almacenamiento donde reside la base de datos"], "exp": "El SGBD es la capa de aplicación (software) para gestionar y manipular los datos de la base de datos.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 7 (Funcionamiento de un SGBD)", "q": "Cuando una petición llega al SGBD, ¿con qué comprueba que es correcta y en qué parte de los ficheros está la información?", "ok": "Con el diccionario de datos", "mal": ["Con el proceso cliente", "Con el entorno gráfico", "Con la aplicación de usuario"], "exp": "El SGBD verifica la petición a través del diccionario de datos y localiza dónde está la información.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 6.2 (Según su forma de ejecución)", "q": "Según su forma de ejecución, un SGBD bicapa es aquel en el que:", "ok": "El SGBD y la base de datos están en uno o varios servidores que reciben las conexiones de los clientes a través de la red (cliente/servidor)", "mal": ["El SGBD, la base de datos y el cliente están alojados en el mismo equipo, por lo que se usa con pocos datos y pocos usuarios", "Existen uno o varios servidores intermedios entre los usuarios y la base de datos, como ocurre habitualmente en la web", "La base de datos se gestiona sin SGBD, mediante ficheros planos a los que cada cliente accede directamente"], "exp": "Bicapa = esquema cliente/servidor. La opción del mismo equipo describe el monocapa y la de servidores intermedios, el multicapa.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 8 (Ventajas de los SGBD frente a los sistemas de ficheros)", "q": "¿Cuál de las siguientes es una ventaja de los SGBD frente a los sistemas de ficheros tradicionales?", "ok": "Permiten el acceso concurrente de varios usuarios a la información, al mismo tiempo y desde distintos lugares", "mal": ["Eliminan la necesidad de contar con administradores de la base de datos", "Permiten que cualquier usuario acceda sin estar autorizado previamente", "Obligan a repetir los ficheros para asegurar la integridad"], "exp": "Ventajas: aprovechamiento del espacio, seguridad, acceso sencillo, integridad y acceso concurrente.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 4 (Principales componentes de un SGBD)", "q": "¿Qué perfil de usuario se encarga de diseñar la base de datos y controlar su desarrollo e implantación?", "ok": "Analista", "mal": ["Programador", "Operador de mantenimiento", "Usuario final"], "exp": "Los analistas diseñan la BD y controlan su desarrollo; los programadores desarrollan aplicaciones según sus directrices.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 6.1 (Según su tamaño)", "q": "Según su tamaño, ¿cuál de los siguientes es un SGBD ligero?", "ok": "SQLite", "mal": ["Oracle", "MySQL", "PostgreSQL"], "exp": "Los ligeros (SQLite, MS Access, LibreOffice Base) se usan cuando no se necesita gran rendimiento. Oracle, MySQL y PostgreSQL son de alto rendimiento.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 4 (Principales componentes de un SGBD)", "q": "¿Qué componente de un SGBD contiene los metadatos, es decir, la información sobre los datos y su estructura?", "ok": "El diccionario de datos", "mal": ["El entorno gráfico", "Las utilidades de copia de seguridad", "El lenguaje de programación"], "exp": "El diccionario de datos contiene los metadatos: información relativa a los datos del sistema y a su estructura.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 6.2 (Según su forma de ejecución)", "q": "¿Qué tipo de SGBD tiene uno o varios servidores intermedios entre los usuarios y la base de datos, como ocurre habitualmente en la web?", "ok": "SGBD multicapa", "mal": ["SGBD monocapa", "SGBD bicapa", "SGBD ligero"], "exp": "En el multicapa hay servidores intermedios; en el bicapa (cliente/servidor) no; en el monocapa todo está en el mismo equipo.", "code": null}, {"tema": 2, "ref": "Tema 2, apdo. 9.2 (SGBD comerciales)", "q": "¿Qué SGBD comercial, objeto-relacional y basado en arquitectura cliente/servidor, es propietario además de MySQL?", "ok": "Oracle", "mal": ["Microsoft SQL Server", "DB2", "Sybase - SAP"], "exp": "Oracle es el SGBD objeto-relacional más reconocido; la empresa es propietaria de Java (Sun Microsystems) y MySQL.", "code": null}, {"tema": 3, "ref": "Tema 3, apdos. 6 (Relaciones) y 7 (Rol en una relación)", "q": "En el modelo entidad-relación, ¿cómo se llama la relación que asocia ejemplares de una misma entidad (por ejemplo, empleados con su jefe, que también es empleado)?", "ok": "Relación reflexiva", "mal": ["Relación binaria", "Relación doble", "Relación ternaria"], "exp": "Las relaciones reflexivas relacionan dos ocurrencias de una misma entidad. Las dobles son dos relaciones distintas entre las mismas entidades.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 7 (Conceptos de cardinalidad y rol)", "q": "En un diagrama entidad-relación, la cardinalidad mínima de una entidad en una relación puede tomar los valores:", "ok": "0 o 1", "mal": ["1 o N", "0 o N", "Solo 1"], "exp": "La cardinalidad mínima toma valor 0 o 1; la máxima, normalmente 1 o N.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 9 (Especialización)", "q": "La especialización en la que una ocurrencia de la superclase puede materializarse a la vez en varias subclases, y que se representa sin arco, es la:", "ok": "Especialización inclusiva", "mal": ["Especialización exclusiva", "Especialización total", "Especialización parcial"], "exp": "Inclusiva: puede pertenecer a varias subclases (sin arco). Exclusiva: solo a una (con arco).", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 2 (Diseño de una base de datos)", "q": "¿En qué fase del diseño es necesario elegir el SGBD y el tipo de base de datos (relacional, orientada a objetos…)?", "ok": "En el diseño lógico", "mal": ["En el diseño conceptual", "En la fase de requisitos", "En la implementación"], "exp": "Hasta el diseño conceptual el proceso es genérico; en el diseño lógico ya hay que elegir el SGBD y el tipo de BD.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 8 (El modelo E/R ampliado)", "q": "En el modelo E/R ampliado, ¿cómo se denomina la entidad que necesita a otra para existir y se representa con un rectángulo de borde doble?", "ok": "Entidad débil", "mal": ["Entidad fuerte", "Superentidad", "Subentidad"], "exp": "Una entidad débil depende de otra (fuerte) en existencia y/o identificación y se dibuja con doble línea.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 9 (Especialización)", "q": "En el modelo E/R ampliado, la especialización en la que cada ocurrencia de la superclase solo puede pertenecer a una de las subclases, y que se representa con un arco junto al triángulo, es la:", "ok": "Especialización exclusiva", "mal": ["Especialización inclusiva", "Especialización total", "Especialización parcial"], "exp": "En la exclusiva cada ocurrencia solo se materializa en una subclase (se dibuja con arco). La inclusiva permite varias y se dibuja sin arco.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 8 (El modelo E/R ampliado)", "q": "En una relación de herencia (ISA):", "ok": "Las subentidades heredan los atributos comunes de la superentidad", "mal": ["La superentidad hereda los atributos de las subentidades", "Las subentidades no pueden tener atributos propios", "Solo puede haber una subentidad por superentidad"], "exp": "Las superentidades tienen los atributos comunes y las subentidades los heredan (además de tener los suyos).", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 2 (Diseño de una base de datos)", "q": "¿Cuál es el orden correcto de las fases del diseño de una base de datos?", "ok": "Requisitos de partida, diseño conceptual, diseño lógico, diseño físico e implementación", "mal": ["Diseño físico, diseño lógico, diseño conceptual, requisitos e implementación", "Diseño lógico, requisitos, diseño conceptual, implementación y diseño físico", "Implementación, diseño conceptual, diseño físico, requisitos y diseño lógico"], "exp": "Las fases son secuenciales: requisitos → conceptual → lógico → físico → implementación.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 8 (El modelo E/R ampliado)", "q": "Si una entidad débil tiene dependencia en existencia respecto a una entidad fuerte, significa que:", "ok": "Si se elimina la entidad fuerte, también se elimina la débil", "mal": ["La entidad débil no puede tener atributos", "La entidad fuerte se identifica con la clave de la débil", "La entidad débil puede existir aunque no exista la fuerte"], "exp": "Dependencia en existencia: si la entidad fuerte se elimina, también lo hace la débil.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 7 (Conceptos de cardinalidad y rol)", "q": "En un diagrama E/R, la cardinalidad máxima de una entidad en una relación toma normalmente el valor:", "ok": "1 o N", "mal": ["0 o 1", "0 o N", "Siempre N"], "exp": "La cardinalidad mínima suele ser 0 o 1 y la máxima, normalmente, 1 o N.", "code": null}, {"tema": 3, "ref": "Tema 3, apdo. 6 (Relaciones)", "q": "En un diagrama entidad-relación, las relaciones se representan mediante:", "ok": "Un rombo con el nombre de la relación", "mal": ["Un rectángulo", "Una elipse", "Un rectángulo con doble línea"], "exp": "Entidades: rectángulos; atributos: elipses; relaciones: rombos.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 2.2 (Grado y cardinalidad)", "q": "Una tabla HABITACIONES tiene 4 columnas (id_hab, num_camas, tipo_cama, ubicacion) y contiene 5 filas. ¿Cuál es su grado y su cardinalidad?", "ok": "Grado 4 y cardinalidad 5", "mal": ["Grado 5 y cardinalidad 4", "Grado 20 y cardinalidad 1", "Grado 4 y cardinalidad 4"], "exp": "El grado es el número de columnas (atributos) y la cardinalidad el número de filas (tuplas).", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 6.2 (Segunda forma normal)", "q": "La tabla COMPRAS(CodProd, CodProveedor, NombreProducto, Cantidad) tiene como clave primaria (CodProd, CodProveedor). Si NombreProducto depende solo de CodProd, ¿qué forma normal incumple la tabla?", "ok": "La segunda forma normal (2FN)", "mal": ["La primera forma normal (1FN)", "Solo la forma normal de Boyce-Codd", "No incumple ninguna forma normal"], "exp": "En 2FN todo atributo no clave debe depender de la clave principal completa. NombreProducto depende solo de una parte de la clave (dependencia parcial).", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 3 (Paso de entidades fuertes y débiles)", "q": "La entidad débil MOVIMIENTO (Código, Tipo, Cantidad) depende de CUENTA_BANCO (N.º Cuenta, Saldo). ¿Cómo queda la tabla MOVIMIENTO en el modelo relacional?", "ok": "MOVIMIENTO (N.º Cuenta, Código, Tipo, Cantidad), incluyendo la clave de la entidad fuerte", "mal": ["MOVIMIENTO (Código, Tipo, Cantidad), sin ningún atributo de la entidad fuerte", "MOVIMIENTO (N.º Cuenta, Saldo, Tipo, Cantidad), copiando todos los atributos de la fuerte", "No se crea tabla: sus atributos se añaden a CUENTA_BANCO"], "exp": "Para pasar una entidad débil a tabla basta con añadir el identificador de la entidad fuerte.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 2 (El modelo relacional)", "q": "En el modelo relacional, la estructura básica formada por filas (tuplas) y columnas (atributos) es:", "ok": "La tabla o relación", "mal": ["El dominio", "La clave ajena", "El diccionario de datos"], "exp": "La estructura básica del modelo relacional es la tabla o relación.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 5.3 (Transformación de relaciones N:M) y Caso práctico 2", "q": "Al pasar al modelo relacional una relación N:M «TIENE» entre ALUMNOS (clave DNI) y CLASES (clave Num_Clase), sin atributos propios, se obtiene:", "ok": "Tres tablas: ALUMNOS, CLASES y TIENE, cuya clave primaria es (DNI, Num_Clase)", "mal": ["Dos tablas, añadiendo Num_Clase como clave ajena en ALUMNOS", "Una única tabla con todos los atributos de ambas entidades", "Dos tablas, añadiendo DNI como clave ajena en CLASES"], "exp": "Las relaciones N:M generan una tabla propia cuya clave primaria es la unión de las claves de las entidades relacionadas (que además son claves ajenas).", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 5.2 (Transformación de relaciones 1:N)", "q": "Al pasar al modelo relacional una relación 1:N «REPRESENTA» entre REPRESENTANTE (1) y ACTOR (N):", "ok": "Se añade la clave de REPRESENTANTE como clave ajena en la tabla ACTORES", "mal": ["Se crea una tabla REPRESENTA con las claves de ambas entidades", "Se añade la clave de ACTOR como clave ajena en la tabla REPRESENTANTES", "Se fusionan ambas entidades en una única tabla"], "exp": "En las relaciones 1:N, a la tabla de la entidad con cardinalidad N se le añade como clave ajena la clave de la entidad con cardinalidad 1 (y los atributos de la relación, si los hay).", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 6.1 (Primera forma normal)", "q": "En una tabla EMPLEADOS(DNI, Nombre, Departamento), María aparece con los departamentos «RR. HH.» y «Administración» en la misma celda. ¿Qué forma normal se incumple?", "ok": "La primera forma normal (1FN)", "mal": ["La segunda forma normal (2FN)", "La tercera forma normal (3FN)", "La forma normal de Boyce-Codd"], "exp": "La 1FN no permite atributos que tomen más de un valor; se soluciona con una fila más para María.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 2.4 (Claves primarias, ajenas, candidatas y alternativas)", "q": "En el modelo relacional, ¿cómo se llaman las claves candidatas que no han sido elegidas como clave primaria?", "ok": "Claves alternativas", "mal": ["Claves ajenas", "Claves primarias", "Dominios de valores"], "exp": "La clave primaria se elige entre las candidatas; las candidatas no seleccionadas son las claves alternativas.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 2.4 (Claves)", "q": "Sobre la clave primaria y el valor NULL, es cierto que:", "ok": "Una clave primaria no puede tener valor nulo, y NULL no es lo mismo que un campo vacío ni que el valor cero", "mal": ["La clave primaria puede ser NULL si la tabla tiene pocas filas", "NULL equivale al valor cero en los campos numéricos", "NULL equivale a dejar el campo vacío"], "exp": "La clave principal no admite nulos; NULL no es lo mismo que vacío ni que cero.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 7.1 (Tercera forma normal)", "q": "La tabla EMPLEADOS(DNI, CodProvincia, Provincia) tiene DNI como clave primaria y el campo Provincia depende de CodProvincia, que no es clave. ¿Qué forma normal incumple?", "ok": "La tercera forma normal (3FN)", "mal": ["La primera forma normal (1FN)", "La segunda forma normal (2FN)", "No incumple ninguna forma normal"], "exp": "En 3FN ningún atributo puede depender de atributos que no son clave (dependencia transitiva). Provincia depende de CodProvincia.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 6 (Normalización)", "q": "¿Cuáles son los dos objetivos principales de la normalización?", "ok": "Evitar la redundancia de datos y evitar dependencias incorrectas entre elementos", "mal": ["Aumentar el número de tablas y de claves ajenas", "Eliminar las claves primarias y los valores nulos", "Convertir el modelo relacional en un modelo orientado a objetos"], "exp": "La normalización busca evitar la redundancia (optimizar espacio) y las dependencias incorrectas.", "code": null}, {"tema": 4, "ref": "Tema 4, apdo. 5.1 (Transformación de relaciones 1:1)", "q": "Al pasar al modelo relacional una relación 1:1 entre ACTOR y PERSONAJE:", "ok": "No se genera tabla para la relación; se propaga la clave de una entidad a la otra (o a ambas) como clave ajena", "mal": ["Siempre se genera una tabla nueva con las claves de ambas entidades", "Se eliminan las dos tablas y se crea una sola con la relación", "Las dos tablas comparten la misma clave primaria sin claves ajenas"], "exp": "Las relaciones 1:1 no generan tabla; hay varias opciones para propagar las claves.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 2.2 (Elementos de SQL)", "q": "AVG, COUNT, SUM, MAX y MIN son ejemplos de:", "ok": "Funciones", "mal": ["Cláusulas", "Operadores", "Metadatos"], "exp": "Las funciones son expresiones predefinidas que devuelven resultados a partir de unas entradas.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 7.1 (Comandos DCL)", "q": "En SQL, ¿qué es un rol?", "ok": "Un conjunto de privilegios agrupados bajo un nombre, que facilita la gestión de permisos", "mal": ["Un usuario con permisos de administrador", "Un tipo de tabla temporal", "Una restricción sobre una columna"], "exp": "Un rol es un conjunto de privilegios bajo un nombre; se asignan a usuarios con GRANT.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 2 (Lenguaje estándar de consulta SQL)", "q": "SQL es un lenguaje declarativo. Esto significa que:", "ok": "Se basa en definir lo que se desea hacer u obtener, de forma similar al lenguaje natural", "mal": ["Hay que indicar paso a paso cómo recorrer los ficheros", "Solo sirve para declarar tablas, no para consultarlas", "Únicamente lo pueden usar los administradores"], "exp": "SQL es declarativo: se indica qué se quiere obtener, no cómo obtenerlo.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 2.2 (Elementos de SQL)", "q": "WHERE, ORDER BY, FROM, GROUP BY y HAVING son ejemplos de:", "ok": "Cláusulas", "mal": ["Comandos", "Funciones", "Literales"], "exp": "Las cláusulas son condiciones o criterios que determinan cómo funciona el comando al que acompañan.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 7.1 (Comandos DCL)", "q": "Los comandos GRANT y REVOKE pertenecen al:", "ok": "Lenguaje de control de datos (DCL)", "mal": ["Lenguaje de definición de datos (DDL)", "Lenguaje de manipulación de datos (DML)", "Grupo de funciones de agregado"], "exp": "DCL agrupa GRANT (conceder) y REVOKE (revocar) permisos a usuarios o roles.", "code": null}, {"tema": 5, "ref": "Tema 5, apdos. 2.2 (Elementos de SQL) y 4 (Lenguaje DDL)", "q": "¿Cuál de los siguientes grupos está formado únicamente por comandos del lenguaje de definición de datos (DDL)?", "ok": "CREATE, ALTER, DROP y TRUNCATE", "mal": ["SELECT, INSERT, UPDATE y DELETE", "GRANT y REVOKE", "WHERE, ORDER BY, GROUP BY y HAVING"], "exp": "DDL: CREATE, ALTER, DROP y TRUNCATE. SELECT/INSERT/UPDATE/DELETE son DML, GRANT/REVOKE son DCL y WHERE, ORDER BY… son cláusulas.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 7.3 (Gestión de permisos y privilegios)", "q": "¿Qué hace la siguiente sentencia? (En MySQL el nombre de usuario se escribe como 'ana'@'localhost'.)", "ok": "Concede a ana los privilegios SELECT e INSERT sobre la tabla clientes y le permite, a su vez, concederlos a otros usuarios", "mal": ["Retira a ana los privilegios SELECT e INSERT sobre la tabla clientes y le impide volver a concederlos a otros usuarios", "Crea el usuario ana con la contraseña clientes y le asigna los privilegios SELECT e INSERT sobre su esquema", "Concede a ana todos los privilegios sobre la tabla clientes, pero no le permite cederlos a otros usuarios"], "exp": "GRANT concede privilegios sobre un objeto; WITH GRANT OPTION permite al usuario asignar ese privilegio a otros usuarios.", "code": ["GRANT SELECT, INSERT ON clientes TO ana WITH GRANT OPTION;"]}, {"tema": 5, "ref": "Tema 5, apdos. 7.1 y 7.3 (Gestión de permisos y privilegios)", "q": "¿Qué hace la siguiente sentencia? (En MySQL el nombre de usuario se escribe como 'luis'@'localhost'.)", "ok": "Retira a luis el privilegio de modificar datos de la tabla productos", "mal": ["Concede a luis el privilegio UPDATE sobre la tabla productos", "Elimina el usuario luis de la base de datos", "Deshace las últimas modificaciones que luis hizo en productos"], "exp": "REVOKE elimina permisos y privilegios concedidos previamente con GRANT; aquí, el privilegio UPDATE sobre la tabla productos. Tanto MySQL como Oracle usan FROM para indicar el usuario (en el apartado 7.3 del libro aparece TO por errata).", "code": ["REVOKE UPDATE ON productos FROM luis;"]}, {"tema": 5, "ref": "Tema 5, apdo. 2.4 (Criterios de notación en SQL)", "q": "En la notación usada para describir la sintaxis de SQL, ¿qué indican los corchetes [ ]?", "ok": "Que esa parte de la sentencia es opcional", "mal": ["Que esa parte es obligatoria", "Que hay varias alternativas separadas por |", "Que la parte anterior puede repetirse"], "exp": "Corchetes: opcional. Llaves: alternativas separadas por |. Puntos suspensivos: repetición.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 7.3 (Gestión de permisos y privilegios)", "q": "¿Qué cláusula permite asignar automáticamente todos los privilegios posibles sobre un objeto?", "ok": "ALL PRIVILEGES", "mal": ["WITH GRANT OPTION", "WITH ADMIN OPTION", "IDENTIFIED BY"], "exp": "ALL PRIVILEGES asigna todos los privilegios; WITH GRANT OPTION permite cederlos a otros usuarios.", "code": null}, {"tema": 5, "ref": "Tema 5, apdo. 5 (Tipos de datos)", "q": "¿Qué diferencia hay entre los tipos CHAR y VARCHAR?", "ok": "CHAR se usa para textos de longitud fija y VARCHAR para textos de longitud variable", "mal": ["CHAR almacena números y VARCHAR almacena fechas", "CHAR es de longitud variable y VARCHAR de longitud fija", "No hay ninguna diferencia entre ellos"], "exp": "CHAR: longitud fija; VARCHAR: longitud variable.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.4 (CHECK y DEFAULT)", "q": "¿Qué restricción se utiliza para crear condiciones que deben cumplir los valores de una columna?", "ok": "CHECK", "mal": ["DEFAULT", "UNIQUE", "PRIMARY KEY"], "exp": "CHECK establece condiciones; DEFAULT asigna un valor por defecto.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 7 (Modificación de tablas)", "q": "¿Qué hace la siguiente sentencia?", "ok": "Añade a la tabla clientes una nueva columna email de texto de hasta 50 caracteres", "mal": ["Crea una nueva tabla llamada email con una columna de texto de hasta 50 caracteres", "Inserta en la tabla clientes una nueva fila con un email de hasta 50 caracteres", "Cambia el nombre de la tabla clientes por email y modifica el tipo de sus columnas"], "exp": "ALTER TABLE modifica la estructura de una tabla; con ADD se añade una columna indicando su tipo de dato.", "code": ["ALTER TABLE clientes ADD email VARCHAR(50);"]}, {"tema": 6, "ref": "Tema 6, apdo. 6 (Restricciones)", "q": "Si una restricción afecta a varias columnas de una tabla (por ejemplo, una clave primaria compuesta):", "ok": "Debe crearse obligatoriamente como restricción a nivel de tabla", "mal": ["Debe crearse a nivel de columna, en cada una de las columnas", "No se puede definir en SQL; hay que controlarlo desde la aplicación", "Solo se puede añadir después con ALTER TABLE"], "exp": "El libro indica que si una restricción afecta a varias columnas debe crearse como restricción de tabla de forma obligatoria (puede hacerse en CREATE TABLE o con ALTER TABLE).", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.1 (NOT NULL)", "q": "La restricción NOT NULL:", "ok": "Obliga a que una columna tenga siempre un valor, es decir, que no acepte valores NULL", "mal": ["Impide que se repitan valores en una columna", "Asigna el valor 0 a la columna si no se indica nada", "Identifica de forma única cada fila de la tabla"], "exp": "NOT NULL obliga a que el campo tenga siempre valor. NULL no es lo mismo que 0.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.3 (PRIMARY KEY y FOREIGN KEY)", "q": "Sobre la restricción PRIMARY KEY, es cierto que:", "ok": "Lleva implícitas las restricciones NOT NULL y UNIQUE", "mal": ["Una tabla puede tener varias claves primarias", "Admite valores NULL si la clave es compuesta", "Solo puede definirse a nivel de columna"], "exp": "Una tabla solo puede tener una clave primaria (de una o varias columnas) y su aplicación lleva implícitas NOT NULL y UNIQUE. Si es compuesta, debe definirse a nivel de tabla.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.3 (PRIMARY KEY y FOREIGN KEY)", "q": "Tras crear la tabla e insertar la fila siguientes (en Oracle se usaría NUMBER y VARCHAR2), ¿cuál de estas inserciones provocará un error?", "ok": "INSERT INTO libros VALUES (1, 'Solaris', 12.00);", "mal": ["INSERT INTO libros VALUES (2, 'Ubik', 15.50);", "INSERT INTO libros VALUES (3, 'Solaris', 9.99);", "INSERT INTO libros VALUES (4, 'Neuromante', 30.00);"], "exp": "El código 1 ya existe y la PRIMARY KEY no admite valores repetidos (lleva implícito UNIQUE). El resto cumple todas las restricciones.", "code": ["CREATE TABLE libros (", "  codigo INT PRIMARY KEY,", "  titulo VARCHAR(40) NOT NULL,", "  precio FLOAT,", "  CONSTRAINT ck_precio CHECK (precio > 0)", ");", "INSERT INTO libros VALUES (1, 'Dune', 20.00);"]}, {"tema": 6, "ref": "Tema 6, apdo. 6.4 (CHECK y DEFAULT); Tema 9, apdo. 2 (Inserción de registros)", "q": "Tras crear la tabla siguiente (en Oracle: NUMBER y VARCHAR2), se ejecuta INSERT INTO autores (codigo, nombre) VALUES (5, 'Ana Ruiz'); ¿qué valor tendrá la columna pais en la fila insertada?", "ok": "'España'", "mal": ["NULL", "Una cadena vacía ('')", "Ninguno: la sentencia da error porque falta la columna pais"], "exp": "La restricción DEFAULT asigna un valor por defecto cuando no se indica valor para ese campo en el INSERT.", "code": ["CREATE TABLE autores (", "  codigo INT,", "  nombre VARCHAR(40) NOT NULL,", "  pais   VARCHAR(20) DEFAULT 'España',", "  CONSTRAINT pk_autor PRIMARY KEY (codigo),", "  CONSTRAINT uq_autor_nombre UNIQUE (nombre),", "  CONSTRAINT ck_autor_codigo CHECK (codigo > 0)", ");"]}, {"tema": 6, "ref": "Tema 6, apdo. 8 (Eliminación de tablas)", "q": "Sobre la instrucción TRUNCATE, es cierto que:", "ok": "Borra todos los datos de la tabla, la tabla sigue existiendo y no puede aplicarse a una parte de ella", "mal": ["Elimina la tabla y su estructura", "Permite borrar solo algunas filas con WHERE", "Se puede deshacer siempre con ROLLBACK"], "exp": "TRUNCATE borra los datos manteniendo la tabla; es irrevocable y no se aplica a una parte de la tabla.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.2 (UNIQUE)", "q": "¿Qué restricción establece que todos los valores de una misma columna sean distintos entre sí?", "ok": "UNIQUE", "mal": ["NOT NULL", "CHECK", "DEFAULT"], "exp": "UNIQUE impide valores repetidos en una columna.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 6.3 (PRIMARY KEY y FOREIGN KEY)", "q": "Sobre la restricción FOREIGN KEY, es cierto que:", "ok": "Define una clave ajena que debe hacer referencia a la clave primaria de otra tabla creada previamente", "mal": ["Identifica de forma única cada registro de su propia tabla", "Solo puede crearse en tablas que no tienen clave primaria", "Asigna un valor por defecto a la columna"], "exp": "FOREIGN KEY define una clave externa que referencia la PRIMARY KEY de la tabla padre.", "code": null}, {"tema": 6, "ref": "Tema 6, apdo. 8 (Eliminación de tablas)", "q": "¿Cuál es la diferencia entre DROP TABLE y TRUNCATE TABLE?", "ok": "TRUNCATE borra todas las filas pero la tabla sigue existiendo; DROP TABLE elimina la tabla y sus datos", "mal": ["DROP TABLE borra solo las filas de la tabla; TRUNCATE elimina la estructura de la tabla y todos sus datos", "TRUNCATE permite borrar solo las filas que cumplen una condición WHERE; DROP TABLE las borra todas", "Ninguna: ambas sentencias eliminan la tabla y sus datos, solo cambia el nombre del comando"], "exp": "TRUNCATE borra los datos manteniendo la tabla; no se puede aplicar a una parte de la tabla. DROP TABLE elimina la tabla y todos sus datos.", "code": null}, {"tema": 7, "ref": "Tema 7, apdo. 3.2 (Concepto de alias)", "q": "¿Qué hace la siguiente consulta?", "ok": "Muestra la columna fecha_matriculacion con el nombre F_MAT en el resultado", "mal": ["Cambia para siempre el nombre de la columna a F_MAT", "Crea una nueva columna F_MAT en la tabla coches", "Filtra los coches cuya fecha sea F_MAT"], "exp": "Un alias da un nombre más legible a una columna (o tabla) solo en el resultado de la consulta.", "code": ["SELECT fecha_matriculacion AS F_MAT", "FROM coches;"]}, {"tema": 7, "ref": "Tema 7, apdo. 10 (Caso práctico 2)", "q": "¿Qué devuelve la siguiente consulta?", "ok": "Cuántos pedidos tienen un importe superior a 1000", "mal": ["La suma de los importes superiores a 1000", "Los pedidos con importe superior a 1000", "El importe medio de los pedidos"], "exp": "COUNT(*) cuenta el número de registros que cumplen la condición del WHERE.", "code": ["SELECT COUNT(*) AS cuenta_pedidos", "FROM pedidos", "WHERE importe > 1000;"]}, {"tema": 7, "ref": "Tema 7, apdo. 6.2 (Criterios de ordenación)", "q": "¿Qué hace la siguiente consulta?", "ok": "Ordena por fabricante de forma ascendente y, dentro de cada fabricante, por precio de mayor a menor", "mal": ["Ordena solo por precio de mayor a menor", "Ordena por fabricante de forma descendente y por precio ascendente", "Da error porque no se puede ordenar por dos columnas"], "exp": "Se puede ordenar por varias columnas, cada una con su propio ASC o DESC.", "code": ["SELECT fabricante, modelo, precio", "FROM coches", "ORDER BY fabricante, precio DESC;"]}, {"tema": 7, "ref": "Tema 7, apdo. 4 (La cláusula WHERE)", "q": "¿Qué productos devuelve esta consulta?", "ok": "Los productos con precio entre 10 y 20, ambos incluidos", "mal": ["Los productos con precio menor que 10 o mayor que 20", "Solo los productos con precio exactamente 10 o 20", "Los productos con precio entre 10 y 20, sin incluir los extremos"], "exp": "BETWEEN ... AND ... selecciona los valores comprendidos en el intervalo, incluidos los extremos.", "code": ["SELECT descripcion, precio", "FROM productos", "WHERE precio BETWEEN 10 AND 20;"]}, {"tema": 7, "ref": "Tema 7, apdo. 7 (Consultas de agrupación)", "q": "¿Qué función de agregado devuelve el valor promedio de un campo?", "ok": "AVG", "mal": ["SUM", "COUNT", "MAX"], "exp": "AVG: promedio; COUNT: número de registros; SUM: suma; MAX/MIN: máximo y mínimo.", "code": null}, {"tema": 7, "ref": "Tema 7, apdos. 4 (WHERE), 6 (ORDER BY) y 7 (GROUP BY)", "q": "¿Qué devuelve la siguiente consulta?", "ok": "Para cada cliente, el número de pedidos de importe superior a 100, ordenado de mayor a menor número de pedidos", "mal": ["El número total de pedidos de importe superior a 100 de toda la tabla, ordenado alfabéticamente por cliente", "Para cada cliente, la suma de los importes de sus pedidos superiores a 100, ordenada de mayor a menor", "Un error, porque en ORDER BY no se puede indicar la columna por su posición (2) en lugar de por su nombre"], "exp": "WHERE filtra las filas, GROUP BY agrupa por cliente, COUNT(*) cuenta las filas de cada grupo y ORDER BY 2 DESC ordena por la 2.ª columna de forma descendente.", "code": ["SELECT cliente, COUNT(*) AS num_pedidos", "FROM pedidos", "WHERE importe > 100", "GROUP BY cliente", "ORDER BY 2 DESC;"]}, {"tema": 7, "ref": "Tema 7, apdo. 8 (La cláusula HAVING)", "q": "Si en una misma consulta de agrupación se usan WHERE y HAVING:", "ok": "WHERE filtra primero las filas de la tabla y después HAVING aplica la condición a los grupos resultantes", "mal": ["HAVING filtra primero las filas de la tabla y después WHERE aplica la condición a los grupos resultantes", "No se pueden usar las dos cláusulas en la misma sentencia; hay que elegir WHERE o HAVING", "Las dos cláusulas hacen exactamente lo mismo, por lo que es indiferente usar una u otra"], "exp": "WHERE excluye filas antes de agrupar; HAVING aplica la condición a los grupos restantes como un todo.", "code": null}, {"tema": 7, "ref": "Tema 7, apdos. 7 (GROUP BY) y 8 (La cláusula HAVING)", "q": "¿Qué devuelve la siguiente consulta?", "ok": "El precio medio de los coches de cada fabricante, mostrando solo los fabricantes cuya media supera 20000", "mal": ["Los coches cuyo precio individual supera 20000, agrupados por fabricante y sin calcular ninguna media", "El precio medio de todos los coches de la tabla, solo si esa media global supera 20000", "Un error, porque HAVING no puede usar funciones de agregado como AVG en su condición"], "exp": "GROUP BY forma un grupo por fabricante, AVG calcula la media de cada grupo y HAVING filtra los grupos (no las filas).", "code": ["SELECT fabricante, AVG(precio) AS precio_medio", "FROM coches", "GROUP BY fabricante", "HAVING AVG(precio) > 20000;"]}, {"tema": 7, "ref": "Tema 7, apdo. 2 (El comando SELECT)", "q": "¿Qué hace la palabra DISTINCT en una sentencia SELECT?", "ok": "Descarta las filas repetidas del resultado", "mal": ["Selecciona también las filas repetidas", "Ordena el resultado de forma descendente", "Agrupa las filas por una columna"], "exp": "ALL selecciona las filas repetidas; DISTINCT las descarta.", "code": null}, {"tema": 7, "ref": "Tema 7, apdo. 6.3 (Orden ascendente y descendente)", "q": "Si no se indica ASC ni DESC en la cláusula ORDER BY, el resultado se ordena de forma:", "ok": "Ascendente", "mal": ["Descendente", "Aleatoria", "Por orden de inserción"], "exp": "Por defecto la ordenación es ascendente; por eso ASC no suele escribirse.", "code": null}, {"tema": 7, "ref": "Tema 7, apdo. 6 (La cláusula ORDER BY)", "q": "Sobre la cláusula ORDER BY, es cierto que:", "ok": "Por defecto ordena de forma ascendente y permite indicar la columna por su posición en la lista del SELECT (por ejemplo, ORDER BY 2)", "mal": ["Por defecto ordena de forma descendente y solo permite indicar la columna por su nombre, nunca por su posición", "Solo permite ordenar por una columna, por lo que para ordenar por varias hay que hacer varias consultas", "Debe escribirse siempre antes de la cláusula WHERE para que la ordenación se aplique a todas las filas"], "exp": "El orden por defecto es ASC; se puede ordenar por varias columnas y por índice de posición. ORDER BY va al final de la sentencia.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 7.1 (UNION e INTERSECT)", "q": "¿Qué diferencia hay entre UNION y UNION ALL?", "ok": "UNION elimina las filas duplicadas y UNION ALL las mantiene", "mal": ["UNION ALL elimina las filas duplicadas y UNION las mantiene", "UNION ALL solo devuelve las filas comunes", "No hay ninguna diferencia"], "exp": "UNION combina dos SELECT eliminando duplicados; UNION ALL los mantiene.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 6.4 (IN, NOT IN, EXISTS y NOT EXISTS)", "q": "EXISTS devuelve el valor «verdadero» cuando:", "ok": "La subconsulta devuelve algún valor", "mal": ["La subconsulta no devuelve ninguna fila", "La subconsulta devuelve exactamente una fila", "La subconsulta contiene valores NULL"], "exp": "EXISTS es verdadero si la subconsulta devuelve algún valor; NOT EXISTS, en caso contrario.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 6.4 (Subconsultas con IN, NOT IN, EXISTS y NOT EXISTS)", "q": "Al trabajar con subconsultas, ¿qué expresión devuelve exactamente los mismos resultados que =ANY?", "ok": "IN", "mal": ["ALL", "NOT IN", "EXISTS"], "exp": "El libro indica que, en subconsultas, =ANY e IN son equivalentes y devuelven idénticos resultados.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 6.3 (Subconsultas con ALL y ANY)", "q": "¿Qué productos devuelve la siguiente consulta?", "ok": "Los productos con un precio mayor que el de todos los productos de ASUS", "mal": ["Los productos con un precio mayor que el de alguno de los productos de ASUS", "Solo los productos de ASUS", "Los productos con el mismo precio que algún producto de ASUS"], "exp": "ALL compara con todas las filas de la subconsulta: la condición debe cumplirse para todas.", "code": ["SELECT nombre, precio", "FROM productos", "WHERE precio > ALL (SELECT precio FROM productos", "                    WHERE fabricante = 'ASUS');"]}, {"tema": 8, "ref": "Tema 8, apdo. 4 (Composiciones externas)", "q": "¿Qué devuelve la siguiente consulta?", "ok": "Todos los departamentos con sus empleados, incluidos los departamentos sin empleados (con NULL en el nombre del empleado)", "mal": ["Solo los departamentos que tienen al menos un empleado, junto con el nombre de cada uno de sus empleados", "Todos los empleados, incluidos los que no tienen departamento (con NULL en el nombre del departamento)", "El producto cartesiano: cada departamento combinado con todos los empleados, coincida o no el cod_dep"], "exp": "LEFT JOIN es una composición externa: devuelve todas las filas de la tabla de la izquierda aunque no tengan coincidencia en la derecha.", "code": ["SELECT d.nombre, e.nombre", "FROM departamentos d", "LEFT JOIN empleados e ON d.cod_dep = e.cod_dep;"]}, {"tema": 8, "ref": "Tema 8, apdo. 4 (Composiciones externas)", "q": "¿Qué diferencia a las composiciones externas de INNER JOIN?", "ok": "Que en el resultado se añaden también filas que no cumplen la condición de combinación", "mal": ["Que no necesitan ninguna condición de combinación", "Que solo devuelven las filas que no coinciden", "Que solo se pueden usar con tres o más tablas"], "exp": "Las composiciones externas son como INNER JOIN, pero añaden filas que no cumplen la condición.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 3.1 (JOIN)", "q": "INNER JOIN (o simplemente JOIN) devuelve:", "ok": "Las filas de ambas tablas en las que existe coincidencia a través de uno de los campos", "mal": ["Todas las filas de ambas tablas, coincidan o no", "Solo las filas de la tabla izquierda que no tienen coincidencia", "El producto cartesiano de las dos tablas"], "exp": "La composición interna devuelve la intersección: las filas que coinciden en la condición.", "code": null}, {"tema": 8, "ref": "Tema 8, apdos. 6 y 6.1 (Subconsultas. Operadores de comparación)", "q": "¿Qué devuelve la siguiente consulta?", "ok": "El nombre de los productos cuyo precio es superior al precio medio de todos los productos", "mal": ["El precio medio de todos los productos, calculado por la subconsulta con la función AVG", "El nombre del producto más caro, que es el único cuyo precio supera la media", "Un error, porque una subconsulta no puede usar funciones de agregado como AVG"], "exp": "La subconsulta es escalar (devuelve una sola fila y columna: la media) y se compara con el operador >.", "code": ["SELECT nombre", "FROM productos", "WHERE precio > (SELECT AVG(precio) FROM productos);"]}, {"tema": 8, "ref": "Tema 8, apdo. 6 (Subconsultas)", "q": "¿Qué tipo de subconsulta devuelve una sola columna y una sola fila?", "ok": "Subconsulta escalar", "mal": ["Subconsulta de fila", "Subconsulta de tabla", "Subconsulta multitabla"], "exp": "Escalares: una fila y una columna. De fila: varias columnas y una fila. De tabla: una o varias columnas y cero o varias filas.", "code": null}, {"tema": 8, "ref": "Tema 8, apdo. 2.1 (Producto cruzado o cartesiano)", "q": "¿Qué devuelve la siguiente consulta, sin ninguna condición que relacione las tablas?", "ok": "El producto cartesiano: cada fila de empleados combinada con todas las filas de tareas", "mal": ["Solo los empleados que tienen alguna tarea asignada", "Las tareas que no tienen empleado", "Un error, porque faltan las claves ajenas"], "exp": "Al combinar dos tablas sin condición se obtiene el producto cartesiano.", "code": ["SELECT * FROM empleados, tareas;"]}, {"tema": 8, "ref": "Tema 8, apdo. 3.2 (NATURAL JOIN)", "q": "¿Qué tipo de composición establece la igualdad entre dos tablas a través de las columnas que tienen el mismo nombre en ambas, sin necesidad de la cláusula ON?", "ok": "NATURAL JOIN", "mal": ["INNER JOIN", "LEFT JOIN", "Producto cartesiano"], "exp": "NATURAL JOIN relaciona las tablas por los campos con el mismo nombre; a diferencia de JOIN, no necesita ON.", "code": null}, {"tema": 9, "ref": "Tema 9, apdo. 4 (Borrado de registros)", "q": "¿Qué ocurre al ejecutar la siguiente sentencia?", "ok": "Se borran todas las filas de la tabla empleados, pero la tabla sigue existiendo", "mal": ["Se elimina la tabla empleados con su estructura y todos sus datos, como con DROP TABLE", "No se borra nada, porque la cláusula WHERE es obligatoria en una sentencia DELETE", "Se borra solo la primera fila de la tabla empleados, porque no se indica ninguna condición"], "exp": "En DELETE la cláusula WHERE es opcional: sin ella se eliminan todas las filas. DELETE es DML y no elimina la estructura (eso lo hace DROP TABLE).", "code": ["DELETE FROM empleados;"]}, {"tema": 9, "ref": "Tema 9, apdo. 2 (Inserción de registros)", "q": "¿Cuándo se puede omitir la lista de columnas en una sentencia INSERT?", "ok": "Cuando se indican valores para todos los campos de la tabla y en el mismo orden que las columnas", "mal": ["Siempre, porque el SGBD deduce a qué columna va cada valor", "Nunca, la lista de columnas es obligatoria", "Solo cuando la tabla no tiene clave primaria"], "exp": "Si los valores corresponden a cada campo y en el mismo orden, se puede obviar el listado de columnas.", "code": null}, {"tema": 9, "ref": "Tema 9, apdo. 6.2 (Variable AUTOCOMMIT)", "q": "Si la variable AUTOCOMMIT está activada:", "ok": "Se aceptan automáticamente los cambios tras ejecutar cada sentencia, y no se pueden deshacer", "mal": ["Ningún cambio es definitivo hasta ejecutar COMMIT", "Las sentencias se deshacen automáticamente al cerrar la sesión", "No se pueden ejecutar sentencias INSERT"], "exp": "Con AUTOCOMMIT activo los cambios se aceptan automáticamente; desactivada, hay que ejecutar COMMIT.", "code": null}, {"tema": 9, "ref": "Tema 9, apdo. 2 (Inserción de registros)", "q": "Si en un INSERT no se especifica el valor de un campo, ese campo contendrá:", "ok": "El valor NULL, siempre que sea posible", "mal": ["El valor 0", "Una cadena vacía", "El valor del registro anterior"], "exp": "El libro indica que el campo contendrá NULL, siempre que sea posible (salvo que tenga, por ejemplo, un DEFAULT).", "code": null}, {"tema": 9, "ref": "Tema 9, apdo. 6.1 (Propiedades de las transacciones)", "q": "¿Qué propiedad ACID garantiza que, si no se pueden ejecutar todas las sentencias de una transacción, no se ejecute ninguna?", "ok": "Atomicidad", "mal": ["Consistencia", "Aislamiento", "Durabilidad"], "exp": "Atomicidad: la transacción es indivisible; si falla alguna tarea, se deshacen los cambios ya aplicados.", "code": null}, {"tema": 9, "ref": "Tema 9, apdo. 3 (Modificación de registros)", "q": "¿Qué ocurre al ejecutar la siguiente sentencia?", "ok": "Se modifica la ciudad de todos los empleados de la tabla", "mal": ["No se modifica nada porque falta WHERE", "Solo se modifica el primer empleado", "Se produce un error de sintaxis"], "exp": "En UPDATE la cláusula WHERE es opcional; sin ella se modifican todas las filas.", "code": ["UPDATE empleados", "SET ciudad = 'Sevilla';"]}, {"tema": 9, "ref": "Tema 9, apdo. 6.1 (Propiedades de las transacciones)", "q": "¿Qué propiedad ACID garantiza que el resultado de una transacción no sea visible para otras transacciones hasta que haya finalizado?", "ok": "Aislamiento", "mal": ["Atomicidad", "Consistencia", "Durabilidad"], "exp": "Aislamiento (Isolation): las transacciones simultáneas no se afectan entre sí.", "code": null}, {"tema": 9, "ref": "Tema 9, apdos. 6.3, 7.1 y 7.2 (SAVEPOINT y ROLLBACK TO SAVEPOINT)", "q": "La tabla t está vacía. ¿Qué filas contendrá t después de ejecutar este bloque? (En Oracle no es necesario START TRANSACTION.)", "ok": "Solo 'Uno'", "mal": ["'Uno' y 'Dos'", "Ninguna fila", "Solo 'Dos'"], "exp": "ROLLBACK TO SAVEPOINT sp1 anula lo hecho después del punto sp1 (el INSERT de 'Dos'); el COMMIT confirma lo anterior ('Uno').", "code": ["START TRANSACTION;", "INSERT INTO t VALUES ('Uno');", "SAVEPOINT sp1;", "INSERT INTO t VALUES ('Dos');", "ROLLBACK TO SAVEPOINT sp1;", "COMMIT;"]}, {"tema": 9, "ref": "Tema 9, apdo. 3.3 (Modificación de datos mediante subconsulta)", "q": "¿Qué hace la siguiente sentencia?", "ok": "Incrementa un 15 % el salario de los empleados que pertenecen a la sección «Productivo»", "mal": ["Incrementa un 15 % el salario de todos los empleados, pertenezcan o no a esa sección", "Fija en 1,15 el salario de los empleados que pertenecen a la sección «Productivo»", "Crea una nueva columna salario en la tabla secciones con el valor de la sección «Productivo»"], "exp": "UPDATE modifica las columnas indicadas en SET solo en las filas que cumplen el WHERE; aquí la condición se obtiene con una subconsulta.", "code": ["UPDATE empleados", "SET salario = salario * 1.15", "WHERE cod_seccion IN (SELECT cod_seccion", "                      FROM secciones", "                      WHERE nombre = 'Productivo');"]}, {"tema": 9, "ref": "Tema 9, apdo. 5 (Caso práctico 1)", "q": "¿Qué hace la siguiente sentencia?", "ok": "Elimina de empleados a los que aparecen en la tabla faltas_graves", "mal": ["Elimina la tabla faltas_graves", "Elimina a los empleados que no tienen faltas graves", "Elimina todas las faltas graves de los empleados"], "exp": "Se pueden borrar registros usando una subconsulta como condición en el WHERE.", "code": ["DELETE FROM empleados", "WHERE id_empleado IN (SELECT id_empleado", "                      FROM faltas_graves);"]}, {"tema": 9, "ref": "Tema 9, apdo. 6.1 (Propiedades de las transacciones)", "q": "¿Qué propiedad ACID garantiza que los cambios de una transacción ejecutada correctamente sean permanentes?", "ok": "Durabilidad", "mal": ["Aislamiento", "Atomicidad", "Consistencia"], "exp": "Durabilidad: los cambios de las transacciones confirmadas son permanentes.", "code": null}], "des": [{"tema": 2, "ref": "Tema 2, apdos. 3 y 3.1", "q": "Arquitectura ANSI/X3/SPARC de un SGBD. Contesta a los siguientes apartados:", "sub": ["a) Define qué es la arquitectura ANSI/X3/SPARC y para qué sirve. (0,1 puntos)", "b) Define cada uno de sus tres niveles (interno o físico, conceptual o lógico y externo o de usuario) e indica qué se describe en cada uno. (0,7 puntos)", "c) Explica por qué en una base de datos suele haber un único esquema físico y un único esquema lógico, pero varios esquemas externos. (0,2 puntos)"], "sol": ["Es un estándar (modelo de tres niveles) que divide la base de datos en tres niveles independientes para facilitar su diseño, implementación y mantenimiento.", "Nivel interno o físico: gestión física de los datos (dónde se guardan, nombres de archivos, cómo se accede a los registros, tipos de registro y campos). Depende del hardware y del software.", "Nivel conceptual o lógico: describe la estructura de los datos (normalmente lo hace el analista): entidades, atributos, relaciones y normas que deben cumplir los datos.", "Nivel externo o de usuario: cómo percibe el usuario la base de datos; es el más cercano a él.", "Hay un único esquema físico y uno lógico, pero varios externos porque, según el usuario, se muestran unos datos y se ocultan otros."], "crit": [["Definición de la arquitectura y su finalidad", "0,1"], ["Nivel interno o físico", "0,25"], ["Nivel conceptual o lógico", "0,25"], ["Nivel externo o de usuario", "0,2"], ["Justificación de un esquema físico/lógico y varios externos", "0,2"]]}, {"tema": 2, "ref": "Tema 2, apdo. 4", "q": "Componentes de un SGBD. Contesta a los siguientes apartados:", "sub": ["a) Enumera y define cinco componentes de un SGBD, además de los usuarios. (0,5 puntos)", "b) Enumera y define los cinco perfiles de usuario que intervienen en una base de datos. (0,5 puntos)"], "sol": ["Datos almacenados: en ficheros, organizados de manera adecuada y eficiente.", "Lenguaje de programación: permite a los usuarios acceder a los datos para añadir, consultar o modificar información.", "Diccionario de datos: contiene los metadatos, información sobre los datos y su estructura.", "Utilidades y herramientas: ayudan a la administración (copias de seguridad, usuarios y grupos, estadísticas, permisos…).", "Entorno gráfico: facilita el uso a usuarios menos avanzados.", "Usuarios (junto a los datos, el principal activo). Perfiles: administradores (gestionan su funcionamiento), analistas (diseñan la BD y controlan su implantación), programadores (desarrollan aplicaciones según los analistas), operadores de mantenimiento (soporte e incidencias) y usuarios finales (explotan la BD con distintos permisos)."], "crit": [["a) Cinco componentes definidos (0,1 cada uno)", "0,5"], ["b) Cinco perfiles de usuario definidos (0,1 cada uno)", "0,5"]]}, {"tema": 3, "ref": "Tema 3, apdos. 8 y 9", "q": "Modelo entidad-relación ampliado. Contesta a los siguientes apartados:", "sub": ["a) Define entidad débil y explica los dos tipos de dependencia. (0,3 puntos)", "b) Explica las relaciones de herencia (ISA): superentidad, subentidad, generalización y especialización. (0,3 puntos)", "c) Explica los tipos de especialización (exclusiva, inclusiva, total y parcial) y cómo se representan. (0,4 puntos)"], "sol": ["Entidad débil: depende de otra (fuerte) para existir; doble rectángulo. Dependencia en existencia: si se elimina la fuerte, se elimina la débil. En identificación: se identifica mediante la clave de la fuerte.", "ISA: agrupa entidades en una general (generalización) o divide una en otras específicas (especialización). La superentidad tiene los atributos comunes y las subentidades los heredan.", "Exclusiva: una sola subclase (arco). Inclusiva: varias a la vez (sin arco). Total: obligatorio pertenecer a una (círculo sobre el triángulo). Parcial: opcional."], "crit": [["a) Entidad débil y dependencias", "0,3"], ["b) Herencia ISA", "0,3"], ["c) Tipos de especialización (0,1 cada uno)", "0,4"]]}, {"tema": 4, "ref": "Tema 4, apdos. 6, 6.1, 6.2 y 7.1", "q": "Normalización. Contesta a los siguientes apartados:", "sub": ["a) Define qué es la normalización e indica sus dos objetivos. (0,2 puntos)", "b) Define la primera forma normal (1FN) y pon un ejemplo de tabla que no la cumpla. (0,25 puntos)", "c) Define la segunda forma normal (2FN) y pon un ejemplo de tabla que no la cumpla. (0,25 puntos)", "d) Define la tercera forma normal (3FN) y pon un ejemplo de tabla que no la cumpla. (0,3 puntos)"], "sol": ["Normalizar es aplicar una serie de reglas (formas normales, secuenciales) para que las tablas del modelo relacional tengan los atributos necesarios para describir la realidad.", "Objetivos: evitar la redundancia de datos (optimizar y reducir espacio) y evitar dependencias incorrectas entre elementos.", "1FN: no se permiten atributos que tomen más de un valor. Ej.: EMPLEADOS(DNI, Nombre, Departamento) con María en «RR. HH.» y «Administración» en la misma celda; se corrige con una fila por valor.", "2FN: cumplir 1FN y que todo atributo no clave dependa de la clave principal completa. Ej.: COMPRAS(CodProd, CodProveedor, NombreProducto, Cantidad): NombreProducto depende solo de CodProd.", "3FN: cumplir 2FN y que ningún atributo dependa de otro atributo no clave. Ej.: EMPLEADOS(DNI, CodProvincia, Provincia): Provincia depende de CodProvincia.", "(Se valora, sin ser obligatorio, mencionar que existen FNBC, 4FN, 5FN y dominio-clave, y que en la práctica se normaliza hasta 3FN o FNBC.)"], "crit": [["Concepto y objetivos de la normalización", "0,2"], ["1FN: definición + ejemplo", "0,25"], ["2FN: definición + ejemplo", "0,25"], ["3FN: definición + ejemplo", "0,3"]]}, {"tema": 4, "ref": "Tema 4, apdos. 3, 5.1, 5.2 y 5.3", "q": "Paso del modelo entidad-relación al modelo relacional. Explica cómo se transforma cada uno de estos elementos y pon un ejemplo breve de cada caso:", "sub": ["a) Entidades fuertes. (0,2 puntos)", "b) Entidades débiles. (0,2 puntos)", "c) Relaciones 1:1. (0,2 puntos)", "d) Relaciones 1:N. (0,2 puntos)", "e) Relaciones N:M. (0,2 puntos)"], "sol": ["Entidad fuerte: una tabla con tantas columnas como atributos; su atributo clave es la clave primaria. Ej.: EMPLEADOS(DNI, Teléfono, Dirección, Salario).", "Entidad débil: tabla a la que se añade la clave de la entidad fuerte. Ej.: CUENTA_BANCO(N.º Cuenta, Saldo) y MOVIMIENTO(N.º Cuenta, Código, Tipo, Cantidad).", "1:1: no se genera tabla para la relación; se propaga la clave de una entidad a la otra (o a ambas) como clave ajena. Ej.: PERSONAJE(Código, Nombre, Película, Código_Actor).", "1:N: no se genera tabla; la clave del lado 1 pasa como clave ajena a la tabla del lado N, junto con los atributos de la relación. Ej.: ACTORES(Código, Nombre_Artístico, Nombre, Id_Representante, Contrato).", "N:M: se crea una tabla nueva cuya clave primaria es la unión de las claves de las entidades, más los atributos de la relación. Ej.: FÁBRICA(Referencia, Número_serie, Fecha_fabricación)."], "crit": [["Entidades fuertes", "0,2"], ["Entidades débiles", "0,2"], ["Relaciones 1:1", "0,2"], ["Relaciones 1:N", "0,2"], ["Relaciones N:M", "0,2"]]}, {"tema": 5, "ref": "Tema 5, apdos. 4, 6 y 7", "q": "Sublenguajes de SQL. Contesta a los siguientes apartados:", "sub": ["a) Explica para qué sirve el DDL e indica sus comandos. (0,35 puntos)", "b) Explica para qué sirve el DML e indica sus comandos. (0,35 puntos)", "c) Explica para qué sirve el DCL e indica sus comandos. (0,3 puntos)"], "sol": ["DDL: crear, modificar y eliminar las estructuras de la BD (tablas, índices, vistas, claves…). Comandos: CREATE, ALTER, DROP y TRUNCATE. Muchas acciones no se pueden deshacer.", "DML: acceder a la información de las tablas para consultarla, añadirla, modificarla o borrarla. Comandos: SELECT, INSERT, UPDATE y DELETE.", "DCL: establecer o revocar permisos y privilegios sobre usuarios o roles. Comandos: GRANT y REVOKE."], "crit": [["a) DDL", "0,35"], ["b) DML", "0,35"], ["c) DCL", "0,3"]]}, {"tema": 6, "ref": "Tema 6, apdos. 6, 6.1, 6.2, 6.3 y 6.4", "q": "Restricciones (constraints) en SQL. Contesta a los siguientes apartados:", "sub": ["a) Define qué es una restricción e indica en qué dos momentos y a qué dos niveles se puede definir. (0,25 puntos)", "b) Define las restricciones NOT NULL y UNIQUE. (0,2 puntos)", "c) Define las restricciones PRIMARY KEY y FOREIGN KEY. (0,35 puntos)", "d) Define las restricciones CHECK y DEFAULT. (0,2 puntos)"], "sol": ["Restricciones: reglas que limitan los datos que se pueden almacenar; pueden crearse a nivel de columna o de tabla (obligatorio a nivel de tabla si afectan a varias columnas). Se definen al crear la tabla (CREATE TABLE) o después (ALTER TABLE). Es recomendable darles nombre (pk_, uq_, ck_…).", "NOT NULL: la columna no admite valores NULL (NULL no es lo mismo que 0).", "UNIQUE: los valores de la columna no pueden repetirse.", "PRIMARY KEY: identifica de forma única cada fila; solo una por tabla (simple o compuesta); implica NOT NULL y UNIQUE.", "FOREIGN KEY: clave ajena que referencia la clave primaria de otra tabla (tabla padre) creada previamente.", "CHECK: condición que deben cumplir los valores de una columna. DEFAULT: valor por defecto si no se indica ninguno."], "crit": [["Concepto, niveles y momentos de definición", "0,25"], ["NOT NULL y UNIQUE", "0,2"], ["PRIMARY KEY y FOREIGN KEY", "0,35"], ["CHECK y DEFAULT", "0,2"]]}, {"tema": 7, "ref": "Tema 7, apdos. 7 y 8", "q": "Consultas de agrupación. Contesta a los siguientes apartados:", "sub": ["a) Explica para qué sirve GROUP BY. (0,2 puntos)", "b) Enumera y explica las cinco funciones de agregado. (0,4 puntos)", "c) Explica para qué sirve HAVING y en qué se diferencia de WHERE, con un ejemplo. (0,4 puntos)"], "sol": ["GROUP BY agrupa las filas según una columna para obtener subtotales o resúmenes por grupo.", "AVG: promedio. COUNT: número de registros. SUM: suma. MAX: máximo. MIN: mínimo.", "HAVING fija condiciones sobre los grupos en consultas de agrupación. WHERE filtra filas antes de agrupar; HAVING aplica la condición a los grupos. Ej.: SELECT fabricante, AVG(precio) FROM coches GROUP BY fabricante HAVING AVG(precio) > 20000;"], "crit": [["a) GROUP BY", "0,2"], ["b) Funciones de agregado", "0,4"], ["c) HAVING y diferencia con WHERE", "0,4"]]}, {"tema": 8, "ref": "Tema 8, apdo. 6", "q": "Subconsultas. Contesta a los siguientes apartados:", "sub": ["a) Define subconsulta y explica los tres tipos (de fila, de tabla y escalares). (0,4 puntos)", "b) Explica para qué sirven IN, NOT IN, ANY y ALL. (0,4 puntos)", "c) Explica qué hace EXISTS. (0,2 puntos)"], "sol": ["Subconsulta: consulta anidada dentro de otra, que aprovecha su resultado. De fila: varias columnas y una fila. De tabla: una o varias columnas y cero o varias filas. Escalar: una fila y una columna (se usa con =, <, >…).", "IN: el valor está en el resultado. NOT IN: no está (cuidado con los NULL). ANY/SOME: válida si se cumple con alguna fila. ALL: válida si se cumple con todas. =ANY equivale a IN.", "EXISTS devuelve verdadero si la subconsulta devuelve algún valor; NOT EXISTS, lo contrario."], "crit": [["a) Concepto y tipos", "0,4"], ["b) IN, NOT IN, ANY y ALL", "0,4"], ["c) EXISTS", "0,2"]]}, {"tema": 9, "ref": "Tema 9, apdos. 6, 6.1, 6.3, 7.1 y 7.2", "q": "Transacciones. Contesta a los siguientes apartados:", "sub": ["a) Define qué es una transacción. (0,2 puntos)", "b) Define cada una de las propiedades ACID: atomicidad, consistencia, aislamiento y durabilidad. (0,4 puntos)", "c) Explica para qué sirven las sentencias COMMIT y ROLLBACK. (0,2 puntos)", "d) Explica para qué sirven las sentencias SAVEPOINT y ROLLBACK TO SAVEPOINT. (0,2 puntos)"], "sol": ["Transacción: agrupación de sentencias DML que se ejecutan de forma indivisible, como una sola unidad; permite recuperar los datos si hay un fallo durante la transacción.", "Atomicidad: o se ejecutan todas las sentencias o ninguna. Consistencia: la BD empieza y termina en estado consistente. Aislamiento: el resultado no es visible para otras transacciones hasta que termina. Durabilidad: los cambios confirmados son permanentes.", "COMMIT: acepta todas las instrucciones de la transacción y hace los cambios definitivos (el cierre correcto de una sesión produce un COMMIT implícito).", "ROLLBACK: anula todas las instrucciones de la transacción y vuelve al estado anterior a su inicio (una caída del sistema o un fallo de comunicación provocan un ROLLBACK implícito).", "SAVEPOINT nombre: crea un punto intermedio de seguridad dentro de la transacción. ROLLBACK TO SAVEPOINT nombre: deshace solo lo realizado desde ese punto. Al hacer COMMIT o ROLLBACK se eliminan todos los SAVEPOINT."], "crit": [["Concepto de transacción", "0,2"], ["Propiedades ACID (0,1 cada una)", "0,4"], ["COMMIT y ROLLBACK", "0,2"], ["SAVEPOINT y ROLLBACK TO SAVEPOINT", "0,2"]]}], "pr": [{"tipo": "er", "titulo": "Biblioteca municipal", "nivel": "Medio", "temas": [3, 4], "enun": ["Una biblioteca municipal quiere gestionar sus fondos y préstamos:", "• De cada editorial se guarda su código, nombre y ciudad. Cada libro lo publica una única editorial y cada editorial publica uno o varios libros.", "• De cada libro se guarda su ISBN, título y año de publicación. De cada autor, un código, su nombre y su nacionalidad. Un libro puede estar escrito por varios autores y un autor puede escribir varios libros (al menos uno).", "• De cada libro la biblioteca tiene uno o varios ejemplares, numerados 1, 2, 3… dentro de cada libro, de los que se guarda su estado. Un ejemplar no tiene sentido sin el libro al que pertenece.", "• De los socios se guarda el número de socio, DNI, nombre y teléfono. Un ejemplar puede estar prestado, como mucho, a un socio, y un socio puede tener varios ejemplares prestados. Se quiere saber la fecha de préstamo."], "pide": ["a) Realiza el diagrama entidad-relación con las entidades, atributos, claves, relaciones y cardinalidades.", "b) Pasa el diagrama al modelo relacional, indicando las claves primarias y las claves ajenas."], "svg": "<svg width=\"1126pt\" height=\"470pt\"\n viewBox=\"0.00 0.00 1125.87 470.47\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(4 const $ = (t, a={}, ...kids) => { const e=document.createElement(t); for(const k in a){ if(a[k]==null) continue; if(k==='class') e.className=a[k]; else if(k==='html') e.innerHTML=a[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2), a[k]); else e.setAttribute(k,a[k]); } for(const c of kids){ if(c==null) continue; e.append(c.nodeType? c : document.createTextNode(c)); } return e; };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  }
  return box;
}
function prepQ(q){ // baraja opciones

function runPractice(list, title){
  app.innerHTML=''; let i=0, good=0, done=0;
  if(!list.length){ app.append($('div',{class:'card'},'No hay preguntas para repasar.'), $('button',{class:'btn',onclick:()=>go('test')},'Volver')); return; }
  const P=list.map(prepQ);
  const box=$('div',{});
  app.append($('h1',{},title), box);
  function show(){
    box.innerHTML='';
    const it=P[i], q=it.q, idx=DATA.test.indexOf(q);
    const card=$('div',{class:'card'});
    card.append($('div',{class:'qhead'}, $('span',{class:'tag'},'Tema '+q.tema+' · '+TEMAS[q.tema]), $('span',{class:'muted small'},'Pregunta '+(i+1)+' de '+P.length+' · Aciertos: '+good+'/'+done)),
      $('div',{class:'progress'}, $('i',{style:'width:'+(100*i/P.length)+'%'})),
      $('div',{class:'qtext'}, q.q));
    if(q.code) card.append(code(q.code));
    const opts=$('div',{class:'opts'}); let answered=false;
    it.ops.forEach((o,k)=>{
      const b=optButton(k,o,'',()=>{
        if(answered) return; answered=true; done++;
        const right=(k===it.ok); if(right) good++;
        ST.resp[idx]=right;
        const fi=ST.fallos.indexOf(idx);
        if(!right && fi<0) ST.fallos.push(idx);
        if(right && fi>=0) ST.fallos.splice(fi,1);
        save();
        [...opts.children].forEach((ch,j)=>{ ch.disabled=true; if(j===it.ok) ch.classList.add('ok'); else if(j===k) ch.classList.add('ko'); });
        card.append(feedback(q,right));
        const nx=$('div',{class:'row',style:'margin-top:12px'});
        if(i<P.length-1) nx.append($('button',{class:'btn',onclick:()=>{i++;show();}},'Siguiente →'));
        else nx.append($('button',{class:'btn',onclick:end},'Ver resultado'));
        card.append(nx);
      });
      opts.append(b);
    });
    card.append(opts); box.append(card);
  }
  function end(){
    box.innerHTML='';
    const c=$('div',{class:'card'}, $('h2',{},'Resultado'),
      $('div',{class:'score'}, $('div',{}, $('b',{}, good+' / '+P.length), 'aciertos'), $('div',{}, $('b',{}, Math.round(100*good/P.length)+' %'), 'de acierto')),

    box.append(c);
  }

}

function startSim(){
  let qs=[];
  for(const t in SIM_DIST){ qs=qs.concat(shuffle(DATA.test.filter(q=>q.tema==t)).slice(0,SIM_DIST[t])); }
  const P=qs.map(prepQ); const ans=new Array(P.length).fill(null); let i=0, corrected=false; const t0=Date.now();
  app.innerHTML='';
  const head=$('div',{class:'card'}); const box=$('div',{});
  app.append($('h1',{},'Simulacro de examen'), head, box);
  let timer=setInterval(drawHead,1000);
  function drawHead(){
    if(!document.body.contains(head)){ clearInterval(timer); return; }
    head.innerHTML='';
    const s=Math.floor((Date.now()-t0)/1000);
    head.append($('div',{class:'qhead'}, $('b',{},'Pregunta '+(i+1)+' de 20'),
      $('span',{class:'muted small'}, corrected? 'Corregido' : ('Tiempo: '+Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s · Respondidas: '+ans.filter(a=>a!==null).length+'/20'))));
    const nav=$('div',{class:'navq'});
    P.forEach((p,k)=>{ let cls=''; if(corrected){ cls= ans[k]===null? '' : (ans[k]===p.ok?'ok':'ko'); } else if(ans[k]!==null) cls='ans'; if(k===i) cls+=' cur';
      nav.append($('button',{class:cls,onclick:()=>{i=k;show();}}, String(k+1))); });
    head.append(nav);
    if(!corrected) head.append($('button',{class:'btn',onclick:correct},'Corregir'));
  }
  function show(){
    drawHead(); box.innerHTML='';
    const it=P[i], q=it.q;
    const card=$('div',{class:'card'}, $('div',{class:'qhead'}, $('span',{class:'tag'},'Tema '+q.tema)), $('div',{class:'qtext'}, (i+1)+'. '+q.q));
    if(q.code) card.append(code(q.code));
    const opts=$('div',{class:'opts'});
    it.ops.forEach((o,k)=>{
      let cls='';
      if(corrected){ if(k===it.ok) cls='ok'; else if(ans[i]===k) cls='ko'; }
      else if(ans[i]===k) cls='sel';
      opts.append(optButton(k,o,cls,()=>{ if(corrected) return; ans[i]= ans[i]===k? null : k; show(); }, corrected));
    });
    card.append(opts);
    if(corrected){ card.append(ans[i]===null? $('div',{class:'fb ko'}, $('b',{},'En blanco. '), 'La respuesta correcta es: ', $('b',{},q.ok), '. ', q.exp, $('span',{class:'ref'},'📖 '+q.ref)) : feedback(q, ans[i]===it.ok)); }
    else card.append($('p',{class:'small muted'},'Pulsa de nuevo una opción marcada para dejar la pregunta en blanco.'));
    const nx=$('div',{class:'row',style:'margin-top:12px'});
    if(i>0) nx.append($('button',{class:'btn sec',onclick:()=>{i--;show();}},'← Anterior'));
    if(i<19) nx.append($('button',{class:'btn',onclick:()=>{i++;show();}},'Siguiente →'));
    card.append(nx); box.append(card);
  }
  function correct(){
    corrected=true; clearInterval(timer);
    let a=0,f=0,b=0;
    P.forEach((p,k)=>{ const idx=DATA.test.indexOf(p.q); if(ans[k]===null){b++;return;} const r= ans[k]===p.ok; r?a++:f++; ST.resp[idx]=r; const fi=ST.fallos.indexOf(idx); if(!r&&fi<0) ST.fallos.push(idx); if(r&&fi>=0) ST.fallos.splice(fi,1); });
    const nota=Math.max(0, a*0.2 - f*0.06666);
    ST.sims.push(+nota.toFixed(2)); save();
    const res=$('div',{class:'card'}, $('h2',{},'Resultado del simulacro'),
      $('div',{class:'score'}, $('div',{},$('b',{},fmt(nota)),'puntos sobre 4'), $('div',{},$('b',{},a),'aciertos (+'+fmt(a*0.2)+')'), $('div',{},$('b',{},f),'fallos (−'+fmt(f*0.06666)+')'), $('div',{},$('b',{},b),'en blanco')),
      $('p',{class:'small muted'},'Revisa cada pregunta pulsando su número: verás la respuesta correcta, la explicación y dónde está en el libro.'),
      $('div',{class:'row'}, $('button',{class:'btn',onclick:startSim},'Otro simulacro'), $('button',{class:'btn sec',onclick:()=>go('inicio')},'Volver al inicio')));
    app.insertBefore(res, head);
    i=0; show();
  }
  show();
}

}
function copyText(t, btn){
  const done=()=>{ const o=btn.textContent; btn.textContent='¡Copiado!'; setTimeout(()=>btn.textContent=o,1500); };
  try{ navigator.clipboard.writeText(t).then(done, ()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ const ta=$('textarea',{}); ta.value=t; document.body.append(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done(); }
}

go('inicio');
</script>
